[serve.static]
plugins = ["bun-plugin-tailwind"]
# Fallback defines if --define isn't passed (e.g. `bun src/index.ts` directly).
# Prefer `bun run dev`, which injects values from .env.
env = "inline"

[serve.static.define]
"process.env.API_URL" = "\"http://localhost:3000\""
"process.env.ROUTER_API_URL" = "\"http://localhost:4000\""
"process.env.NODE_ENV" = "\"development\""
